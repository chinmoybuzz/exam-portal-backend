<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Portal with Rooms</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind configuration for custom colors
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        'primary': '#4f46e5',
                        'primary-dark': '#4338ca',
                        'danger': '#ef4444',
                        'success': '#10b981',
                        'emerald': { '500': '#10b981', '600': '#059669', '700': '#047857' }
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen flex flex-col bg-gray-100">

    <div class="max-w-6xl mx-auto p-6 space-y-6">

        <div class="flex items-center space-x-2">
            <input id="room-id" placeholder="Enter Room ID" class="p-2 border rounded flex-grow" value="qw12" />
            <button onclick="joinRoom()" class="bg-primary text-white px-4 py-2 rounded">Join Room</button>
        </div>

        <div class="flex space-x-6">

            <div class="w-1/4 bg-white shadow rounded-xl p-4 flex flex-col space-y-4 overflow-y-auto">

                <div class="text-center p-4 bg-primary rounded-lg text-white">
                    <p class="text-sm font-medium">Time Remaining</p>
                    <div class="flex justify-center my-1">
                        <div class="grid grid-cols-2 gap-1">
                            <span class="w-2 h-2 bg-white rounded-full"></span>
                            <span class="w-2 h-2 bg-white rounded-full"></span>
                            <span class="w-2 h-2 bg-white rounded-full"></span>
                            <span class="w-2 h-2 bg-white rounded-full"></span>
                        </div>
                    </div>
                    <div id="timer" class="text-4xl font-extrabold mt-1">--:--</div>
                </div>

                <p class="text-sm font-medium">Your Socket ID:</p>
                <p id="user-id" class="text-xs text-gray-700 bg-gray-100 p-2 rounded">Not connected</p>

                <div>
                    <label class="text-xs font-medium">Set Timer (mins)</label>
                    <div class="space-y-2 mt-1">
                        <input id="duration-input" type="number" min="1" value="5" class="w-full p-2 border rounded" />
                        <button onclick="setTimer()" class="w-full bg-emerald-600 text-white py-2 rounded">
                            Set Timer
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex-1 bg-white shadow rounded-xl p-6 space-y-4">
                <h2 class="text-2xl font-bold text-gray-800">Exam Questions</h2>

                <div id="question-card" class="border border-gray-200 rounded-lg p-4">
                    <div class="flex justify-between mb-3 border-b pb-2">
                        <h3>Question <span id="current-q-index">1</span></h3>
                        <span id="q-status"
                            class="px-2 py-1 text-xs font-semibold rounded-full bg-yellow-100 text-yellow-800">Unanswered</span>
                    </div>
                    <p id="question-text">Waiting for room connection...</p>
                    <div id="options-container" class="space-y-2">
                    </div>
                </div>

                <div class="flex justify-between">
                    <button id="prev-btn" onclick="prevQuestion()"
                        class="px-4 py-2 bg-gray-200 rounded disabled:opacity-50" disabled>← Prev</button>
                    <button id="next-btn" onclick="nextQuestion()"
                        class="px-4 py-2 bg-primary text-white rounded disabled:opacity-50">Next →</button>
                </div>

                <button onclick="submitExam()" id="submit-btn"
                    class="w-full bg-danger text-white py-2 rounded mt-4">Submit Exam</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const SOCKET_SERVER_URL = 'http://localhost:6006';
        let socket, currentRoomId = null;
        let clientTimerState = { timeRemainingMs: 0, status: "idle", endTime: 0 };
        let clientTimerInterval = null;

        let examState = {
            questions: [],
            userAnswers: {},
            currentQuestionIndex: 0,
            isSubmitted: false
        };

        // --- Connection & Initialization ---

        function joinRoom() {
            const roomInput = document.getElementById('room-id');
            const roomId = roomInput.value.trim();
            if (!roomId) return alert("Enter a valid Room ID");

            currentRoomId = roomId;

            if (socket) socket.disconnect();
            socket = io(SOCKET_SERVER_URL, { auth: { roomId } });

            // Socket Event Listeners
            socket.on('connect', () => {
                console.log("Connected", socket.id, "to room", roomId);
                document.getElementById('user-id').textContent = socket.id;
                socket.emit('joinRoom', { roomId });
                socket.emit('requestExamState', { roomId });
            });

            socket.on('disconnect', () => {
                document.getElementById('user-id').textContent = "Disconnected";
            });

            // Handle real-time timer updates from the server
            socket.on('timer:update', (data) => {
                if (data.roomId !== currentRoomId) return;
                clientTimerState = { ...data };
                if (data.status === 'running') startClientTimer();
                else if (data.status === 'finished') stopClientTimer(true);
                else stopClientTimer(false);
            });

            // Handle real-time exam state updates (questions, user answers)
            socket.on('examStateUpdate', (data) => {
                if (!data.questions) return;
                examState = { ...examState, ...data };
                loadQuestion(examState.currentQuestionIndex);
            });
        }

        // --- Timer Functions ---

        function startClientTimer() {
            if (clientTimerInterval) clearInterval(clientTimerInterval);
            const timerEl = document.getElementById('timer');

            const updateUI = () => {
                const remainingMs = clientTimerState.endTime - Date.now();
                if (remainingMs <= 0) { stopClientTimer(true); return; }
                timerEl.textContent = formatTime(remainingMs);
            };

            updateUI();
            clientTimerInterval = setInterval(updateUI, 500);
        }

        function stopClientTimer(isFinished) {
            if (clientTimerInterval) clearInterval(clientTimerInterval);
            const timerEl = document.getElementById('timer');
            timerEl.textContent = isFinished ? "TIME UP!" : "--:--";
        }

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function setTimer() {
            const duration = parseInt(document.getElementById('duration-input').value, 10);
            if (!socket || !socket.connected || !currentRoomId) return alert("Not connected to a room");

            socket.emit('timer:start', { duration: duration * 60, roomId: currentRoomId });
        }

        // --- Exam Navigation & Answer Functions ---

        function loadQuestion(index) {
            if (!examState.questions.length) {
                document.getElementById('question-text').textContent = "No questions received from the server.";
                return;
            }
            if (index < 0) index = 0;
            if (index >= examState.questions.length) index = examState.questions.length - 1;
            examState.currentQuestionIndex = index;

            const q = examState.questions[index];
            const userAnswerIndex = examState.userAnswers[q.id];

            document.getElementById('current-q-index').textContent = index + 1;
            document.getElementById('question-text').textContent = q.text;

            const statusEl = document.getElementById('q-status');
            if (userAnswerIndex !== undefined) {
                statusEl.textContent = "Answered";
                statusEl.className = "px-2 py-1 text-xs font-semibold rounded-full bg-success text-white";
            } else {
                statusEl.textContent = "Unanswered";
                statusEl.className = "px-2 py-1 text-xs font-semibold rounded-full bg-yellow-100 text-yellow-800";
            }

            const container = document.getElementById('options-container');
            container.innerHTML = q.options.map((opt, i) => {
                const selected = userAnswerIndex === i;
                return `<div class="p-2 border rounded cursor-pointer ${selected ? 'bg-primary text-white' : 'hover:bg-gray-100'}"
                             onclick="selectAnswer(${q.id}, ${i})">${String.fromCharCode(65 + i)}. ${opt}</div>`;
            }).join('');

            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').disabled = index === examState.questions.length - 1;
        }

        function selectAnswer(qId, idx) {
            if (!socket || examState.isSubmitted) return;

            examState.userAnswers[qId] = idx;
            loadQuestion(examState.currentQuestionIndex);

            socket.emit('submitAnswer', { roomId: currentRoomId, qId, answerIndex: idx });
        }

        function prevQuestion() { loadQuestion(examState.currentQuestionIndex - 1); }
        function nextQuestion() { loadQuestion(examState.currentQuestionIndex + 1); }

        function submitExam() {
            if (!socket || examState.isSubmitted) return;
            if (!confirm("Are you sure you want to submit the exam?")) return;

            socket.emit('submitExam', { roomId: currentRoomId });

            examState.isSubmitted = true;
            document.getElementById('question-text').textContent = "EXAM SUBMITTED! Waiting for results...";
            document.getElementById('options-container').innerHTML = "";
            document.getElementById('submit-btn').disabled = true;
        }
    </script>
</body>

</html>
